[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-parser"
version = "2.2.0"
description = "Cross-platform HELIOS Parse / View desktop workflow for parser, viewer, and derived analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Dmitrii Bespalov"},
]
dependencies = [
  "numpy>=1.24,<3",
  "h5py>=3.8,<4",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
plot = [
  "matplotlib",
]
viewer = [
  "PySide6",
  "pyqtgraph",
]
desktop = [
  "PySide6",
  "pyqtgraph",
  "matplotlib",
]

[project.scripts]
helios_to_hdf5 = "helios_cli:main"
helios_diag = "helios_diag.cli:main"
helios_plot_radiation = "helios_viewer.radiation_plot:main"
helios_hdf5_viewer = "helios_viewer.__main__:main"
helios_parse_view = "helios_app.__main__:main"

[project.urls]
Documentation = "docs/index.html"

[tool.setuptools]
package-dir = {"" = "src"}
# Top-level modules, not submodules: importing helios_parser.<anything> or
# helios_app.<anything> runs that package __init__ and pulls numpy, h5py or Qt,
# which would make --help and --version cost a quarter of a second.
py-modules = ["helios_cli", "helios_release"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The native table parser is built by scripts/build_native_table.py; when it is
# absent the parser runs its pure-Python fallback.
helios_parser = ["libhelios_native*"]
helios_viewer = ["assets/fonts/*.ttf", "assets/*.png", "assets/*.ico", "assets/icons/*.svg"]
"helios.services.derived" = [
  "resources/*.json",
  "resources/*.md",
  "reference_data/plasmon/*.json",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
# The codebase was written at roughly 120 columns; the previous 88 was declared
# but never applied, so a formatter run at 88 rewrites about 45k lines. 120 is
# the length the source actually uses.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E501 is deliberately not selected: line width belongs to the formatter, and
# selecting both makes every formatting decision a lint failure. E402 is not
# selected globally because scripts and tests bootstrap sys.path before
# importing the package; the per-file ignores below scope that exception, and
# src is expected to be E402-clean.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These entries put the repository root on sys.path before importing the
# package under test, which requires imports after executable statements.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.coverage.run]
# Measure the package and the gate scripts together. Measuring only `src` would
# report a healthy number while `scripts/run_test_suite.py` -- the thing that
# decides whether the suite passed at all -- went unmeasured.
source = ["src", "scripts"]
branch = true
parallel = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

# The floor sits under today's measured value on purpose. A floor pinned just
# below the current number fails on the next commit that adds a module before its
# tests, and what happens then is that the floor gets lowered rather than met.
# Raise it at a milestone boundary, deliberately.
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:",
]
