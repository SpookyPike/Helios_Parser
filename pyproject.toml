[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-parser"
version = "1.3.1"
description = "Cross-platform HELIOS Parse / View desktop workflow for parser, viewer, and derived analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Dmitrii Bespalov"},
]
dependencies = [
  "numpy",
  "h5py",
]

[project.optional-dependencies]
plot = [
  "matplotlib",
]
viewer = [
  "PySide6",
  "pyqtgraph",
]
desktop = [
  "PySide6",
  "pyqtgraph",
  "matplotlib",
]

[project.scripts]
helios_to_hdf5 = "helios_parser.cli:main"
helios_hdf5_viewer = "helios_viewer.__main__:main"
helios_parse_view = "helios_app.__main__:main"

[project.urls]
Documentation = "docs/index.html"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helios_viewer = ["assets/fonts/*.ttf", "assets/*.png", "assets/*.ico", "assets/icons/*.svg"]
"helios.services.derived" = [
  "resources/*.json",
  "resources/*.md",
  "reference_data/plasmon/*.json",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
# Measure the package and the gate scripts together. Measuring only `src` would
# report a healthy number while `scripts/run_test_suite.py` -- the thing that
# decides whether the suite passed at all -- went unmeasured.
source = ["src", "scripts"]
branch = true
parallel = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

# The floor sits under today's measured value on purpose. A floor pinned just
# below the current number fails on the next commit that adds a module before its
# tests, and what happens then is that the floor gets lowered rather than met.
# Raise it at a milestone boundary, deliberately.
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:",
]
